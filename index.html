<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1E6C74"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body><script>
/* claude.ai 밖에서 쓰는 대역 — 앱 본문은 그대로 */
(() => {
  /* 11/11: 키를 페이지에 넣으면 공개 저장소에 비밀이 올라간다(GitHub 가 푸시를 막음) → 키는 이 폰에서 한 번 붙여 넣어 그 폰에만 저장 */
  const MODELS = [["gemini-3.6-flash", {"thinkingConfig": {"thinkingBudget": 0}}], ["gemini-3.1-flash-lite", {}], ["gemini-3.5-flash", {}], ["gemini-3.6-flash", {}], ["gemini-flash-latest", {}], ["gemini-3-flash-preview", {}], ["gemini-3.8-flash", {}], ["gemini-3.5-flash-lite", {}], ["gemini-flash-lite-latest", {}]];
  let KEY = ""; try { KEY = localStorage.getItem("talk-gemini-key") || ""; } catch {}
  if (!KEY) document.addEventListener("DOMContentLoaded", () => {
    const b = document.createElement("div");
    b.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#1E6C74;color:#fff;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font:14px system-ui";
    b.innerHTML = '<span style="flex:1 1 100%">처음 한 번: 회화장 전용 제미나이 키를 붙여 넣어 주세요(이 폰에만 저장돼요)</span>'
      + '<input id="kk" type="password" placeholder="키 붙여 넣기" style="flex:1;min-width:0;padding:8px;border-radius:8px;border:0;font-size:16px">'
      + '<button id="ks" style="padding:8px 14px;border-radius:8px;border:0;font-weight:700">저장</button>';
    document.body.prepend(b);
    b.querySelector("#ks").onclick = () => { const v = b.querySelector("#kk").value.trim(); if (!v) return; try { localStorage.setItem("talk-gemini-key", v); } catch {} location.reload(); };
  });
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function gemRaw(parts, gc, signal) {
    let last = "";
    for (const [m, extra] of MODELS) {
      try {
        const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 15000);   // 한 모델이 느리면 15초에 다음으로
        if (signal) signal.addEventListener("abort", () => ac.abort(), {once: true});
        let r;
        try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${KEY}`, {
          method: "POST", signal: ac.signal, headers: {"Content-Type": "application/json"},
          body: JSON.stringify({contents: [{parts}], generationConfig: {...gc, ...extra}})}); }
        finally { clearTimeout(tm); }
        if (r.status === 401 || r.status === 403) { last = String(r.status); break; }
        if (!r.ok) { last = String(r.status); continue; }
        const j = await r.json();
        return (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
      } catch (e) {
        if (signal && signal.aborted) throw {code: "cancelled"};
        last = String(e && (e.name === "AbortError" ? "timeout" : e.message) || e); await sleep(200);
      }
    }
    throw {code: last === "429" ? "rate_limited" : "network", message: last};
  }
  async function gem(prompt, signal) {
    let last = "";
    for (let i = 0; i < 2; i++) {
      try {
        const t = await gemRaw([{text: prompt}], {responseMimeType: "application/json", temperature: 0.8}, signal);
        try { return JSON.parse(t); } catch { const m2 = t.match(/\{[\s\S]*\}/); if (m2) return JSON.parse(m2[0]); throw {code: "invalid_json"}; }
      } catch (e) {
        if (e && e.code === "invalid_json") { last = "invalid_json"; continue; }   // 한 번 더
        throw e;
      }
    }
    throw {code: "invalid_json", message: last};
  }
  /* 11/11 주인님 "말하는 게 인식이 안 돼 · aborted · 말 안 끝났는데 전송" — 폰 음성 인식(사파리) 대신
     누르는 동안 녹음(wav) → ■ 누르면 제미나이가 받아 적는다. 멈춤을 누르기 전엔 절대 안 보낸다. */
  const dl = {partial: [], final: [], state: []};
  const emit = (k, v) => dl[k].forEach(f => { try { f(v); } catch {} });
  let mic = null;
  function toWav(chunks, rate) {
    let n = 0; chunks.forEach(c => n += c.length);
    const pcm = new Float32Array(n); let o = 0; chunks.forEach(c => { pcm.set(c, o); o += c.length; });
    const R = 16000, step = rate / R, len = Math.floor(n / step), buf = new DataView(new ArrayBuffer(44 + len * 2));
    const w = (p, s) => [...s].forEach((c, i) => buf.setUint8(p + i, c.charCodeAt(0)));
    w(0, "RIFF"); buf.setUint32(4, 36 + len * 2, true); w(8, "WAVE"); w(12, "fmt "); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true);
    buf.setUint16(22, 1, true); buf.setUint32(24, R, true); buf.setUint32(28, R * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true);
    w(36, "data"); buf.setUint32(40, len * 2, true);
    for (let i = 0; i < len; i++) { const s = Math.max(-1, Math.min(1, pcm[Math.floor(i * step)] || 0)); buf.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
    return new Uint8Array(buf.buffer);
  }
  function b64(u8) { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  const dictation = {
    start(opts = {}) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx || !navigator.mediaDevices?.getUserMedia) return Promise.reject({code: "unavailable"});
      const ctx = new Ctx(); ctx.resume().catch(() => {});   // 누른 순간 만든다(아이폰)
      const st = {ctx, chunks: [], lang: opts.language || "en-US", stream: null};
      mic = st; emit("state", {state: "listening"});
      return navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}}).then(stream => {
        st.stream = stream;
        if (mic !== st) { stream.getTracks().forEach(t => t.stop()); return; }
        const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1);
        proc.onaudioprocess = e => { if (mic === st) st.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
        src.connect(proc); proc.connect(ctx.destination); st.proc = proc;
      }).catch(e => { mic = null; try { ctx.close(); } catch {} emit("state", {state: "idle", reason: "error"});
        throw {code: e && e.name === "NotAllowedError" ? "not_granted" : "unavailable", message: String(e && e.message || e)}; });
    },
    async stop() {
      const st = mic; mic = null; if (!st) return;
      try { st.proc && st.proc.disconnect(); } catch {}
      try { st.stream && st.stream.getTracks().forEach(t => t.stop()); } catch {}
      const rate = st.ctx.sampleRate; try { st.ctx.close(); } catch {}
      if (!st.chunks.length) { emit("state", {state: "idle", reason: "stopped"}); return; }
      emit("partial", {text: "🎧 알아듣는 중…"});
      const L = /^ja/.test(st.lang) ? "Japanese" : "English";
      try {
        const t = await gemRaw([{inline_data: {mime_type: "audio/wav", data: b64(toWav(st.chunks, rate))}},
          {text: `A Korean beginner is practicing ${L} conversation. Transcribe exactly what they said. They may mix ${L} and Korean, and may have a strong accent or grammar mistakes — keep their words as spoken (do not correct or translate). Output only the transcript text. If there is no speech, output nothing.`}],
          {temperature: 0}, null);
        emit("final", {text: String(t || "").trim()});
      } catch (e) { emit("partial", {text: ""}); emit("final", {text: ""}); throw e; }
      finally { emit("state", {state: "idle", reason: "stopped"}); }
    },
    onPartial(f) { dl.partial.push(f); }, onFinal(f) { dl.final.push(f); }, onState(f) { dl.state.push(f); },
  };
  const sample = {json: (prompt, opts = {}) => gem(prompt, opts.signal)};
  const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const db = { doc(path) { const k = "malmun-db:" + path; return {
    async get() { const v = ls.get(k); return {exists: v != null, data: () => JSON.parse(v || "{}")}; },
    async set(o) { ls.set(k, JSON.stringify(o)); } }; } };
  const user = { async id() { return "local"; } };
  /* 11/11 아이폰 '소리 전혀 안 들림' — 폰 음성 합성 대신 제미나이 음성(TTS)으로 소리 파일을 받아 <audio> 로 재생.
     아이폰은 '누른 순간' 한 번 재생된 audio 요소만 나중에 소리를 내 준다 → 첫 터치 때 같은 요소로 무음 재생해 열어 둔다. */
  const TTS_MODELS = ["gemini-3.8-flash-lite-tts", "gemini-3.8-flash-tts", "gemini-3.1-flash-tts-preview", "gemini-2.5-flash-preview-tts"];
  const audio = new Audio(); audio.playsInline = true; audio.preload = "auto";
  const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
  let unlocked = false;
  const unlock = () => { if (unlocked) return; unlocked = true; try { audio.src = SILENT; audio.play().catch(() => {}); } catch {} };
  ["touchend", "click", "keydown"].forEach(ev => document.addEventListener(ev, unlock, {capture: true, passive: true}));
  const cache = new Map(); let listeners = []; let state = "idle"; let cur = null;
  const setState = (s, reason) => { state = s; listeners.forEach(f => { try { f({state: s, reason}); } catch {} }); };
  function wav(b64, mime) {
    const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    if (/wav/i.test(mime)) return new Blob([raw], {type: "audio/wav"});
    const rate = +((mime.match(/rate=(\d+)/) || [])[1] || 24000), h = new DataView(new ArrayBuffer(44));
    const w = (o, s) => [...s].forEach((c, i) => h.setUint8(o + i, c.charCodeAt(0)));
    w(0, "RIFF"); h.setUint32(4, 36 + raw.length, true); w(8, "WAVE"); w(12, "fmt "); h.setUint32(16, 16, true); h.setUint16(20, 1, true);
    h.setUint16(22, 1, true); h.setUint32(24, rate, true); h.setUint32(28, rate * 2, true); h.setUint16(32, 2, true); h.setUint16(34, 16, true);
    w(36, "data"); h.setUint32(40, raw.length, true);
    // L16 은 빅엔디언 — wav 는 리틀엔디언이라 뒤집는다
    if (/l16/i.test(mime)) for (let i = 0; i + 1 < raw.length; i += 2) { const t = raw[i]; raw[i] = raw[i + 1]; raw[i + 1] = t; }
    return new Blob([h.buffer, raw], {type: "audio/wav"});
  }
  async function voice(text, language) {
    const ck = language + "|" + text; if (cache.has(ck)) return cache.get(ck);
    let last = "";
    for (const m of TTS_MODELS) {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${KEY}`, {method: "POST",
        headers: {"Content-Type": "application/json"}, body: JSON.stringify({contents: [{parts: [{text}]}], generationConfig: {responseModalities: ["AUDIO"],
        speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: language === "ja" ? "Aoede" : "Kore"}}}}})});
      if (!r.ok) { last = String(r.status); continue; }
      const j = await r.json(); const p = j.candidates?.[0]?.content?.parts?.find(x => x.inlineData)?.inlineData;
      if (!p) { last = "no-audio"; continue; }
      const url = URL.createObjectURL(wav(p.data, p.mimeType || "")); cache.set(ck, url); return url;
    }
    throw {code: last === "429" ? "rate_limited" : "upstream_error", message: last};
  }
  const tts = {
    async speak(text, opts = {}) {
      if (!KEY) throw {code: "not_granted"};
      const mine = {}; cur = mine; setState("starting");
      let url;
      try { url = await voice(String(text).slice(0, 1500), opts.language || "en"); }
      catch (e) { if (cur === mine) setState("idle", "upstream_error"); throw e; }
      if (cur !== mine) throw {code: "stopped", reason: "replaced"};
      return new Promise((res, rej) => {
        audio.onended = () => { setState("idle", "completed"); res({playedMs: 0}); };
        audio.onerror = () => { setState("idle", "upstream_error"); rej({code: "upstream_error", message: "재생 실패"}); };
        audio.src = url; audio.playbackRate = opts.rate || 1;
        audio.play().then(() => setState("speaking")).catch(e => { setState("idle", "no_gesture"); rej({code: "no_gesture", message: String(e && e.name || e)}); });
      });
    },
    async stop() { cur = null; try { audio.pause(); } catch {} setState("idle", "stopped"); },
    onState(f) { listeners.push(f); return () => { listeners = listeners.filter(x => x !== f); }; },
  };
  /* 11/11 주인님 "말 알아듣고 대답하는 데까지 너무 느려 — 진짜 대화처럼" → 제미나이 실시간 음성(Live).
     받아 적기·대답·목소리 3번 부르던 걸(7~10초) 소리를 바로 주고받는 한 연결로(PC 실측 첫 소리 0.4초).
     AI 가 말하는 동안은 마이크 소리를 안 보낸다(스피커 소리를 자기 말로 알아듣는 것 방지). */
  const LIVE_MODELS = ["gemini-3.8-live", "gemini-3.1-flash-live-preview", "gemini-2.5-flash-native-audio-latest"];
  let live = null;
  const talkLive = {
    start(o) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx || !navigator.mediaDevices?.getUserMedia || !window.WebSocket) return Promise.reject({code: "unavailable"});
      const ctx = new Ctx(); ctx.resume().catch(() => {});   // 누른 순간 만든다(아이폰)
      const L = {ctx, ws: null, stream: null, proc: null, head: 0, srcs: [], u: "", a: "", ready: false, closed: false, chain: Promise.resolve()};
      live = L;
      const speaking = () => ctx.currentTime < L.head + 0.35;
      const stopPlay = () => { L.srcs.forEach(s => { try { s.stop(); } catch {} }); L.srcs = []; L.head = 0; };
      const play = (b64s, rate) => {
        const raw = Uint8Array.from(atob(b64s), c => c.charCodeAt(0)), n = raw.length >> 1, dv = new DataView(raw.buffer);
        const buf = ctx.createBuffer(1, n, rate), ch = buf.getChannelData(0);
        for (let i = 0; i < n; i++) ch[i] = dv.getInt16(i * 2, true) / 32768;
        const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination);
        L.head = Math.max(L.head, ctx.currentTime + 0.05); s.start(L.head); L.head += buf.duration;
        L.srcs.push(s); s.onended = () => { L.srcs = L.srcs.filter(x => x !== s); if (!speaking()) o.onState && o.onState("listening"); };
        o.onState && o.onState("speaking");
      };
      const handle = (m) => {
        if (m.setupComplete) {
          L.ready = true; o.onState && o.onState("listening");
          L.ws.send(JSON.stringify({clientContent: {turns: [{role: "user", parts: [{text: o.opening}]}], turnComplete: true}}));
          return;
        }
        const sc = m.serverContent; if (!sc) return;
        if (sc.interrupted) stopPlay();
        if (sc.inputTranscription?.text) { L.u += sc.inputTranscription.text; o.onUser && o.onUser(L.u.trim()); }
        if (sc.outputTranscription?.text) { L.a += sc.outputTranscription.text; o.onAi && o.onAi(L.a.trim()); }
        for (const p of sc.modelTurn?.parts || []) if (p.inlineData?.data) play(p.inlineData.data, +((p.inlineData.mimeType || "").match(/rate=(\d+)/) || [])[1] || 24000);
        if (sc.turnComplete) { const u = L.u.trim(), a = L.a.trim(); L.u = ""; L.a = ""; o.onTurn && o.onTurn({user: u, ai: a}); }
      };
      const connect = (i) => new Promise((res, rej) => {
        if (i >= LIVE_MODELS.length) return rej({code: "unavailable", message: "실시간 모델 연결 실패"});
        const ws = new WebSocket(`wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${KEY}`);
        L.ws = ws; let ok = false;
        ws.onopen = () => ws.send(JSON.stringify({setup: {model: "models/" + LIVE_MODELS[i],
          generationConfig: {responseModalities: ["AUDIO"], speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: o.voice || "Kore"}}}},
          systemInstruction: {parts: [{text: o.system}]}, inputAudioTranscription: {}, outputAudioTranscription: {},
          realtimeInputConfig: {automaticActivityDetection: {silenceDurationMs: o.silenceMs || 1200}}}}));
        ws.onmessage = (ev) => { L.chain = L.chain.then(async () => {
          const t = typeof ev.data === "string" ? ev.data : await ev.data.text(); let m; try { m = JSON.parse(t); } catch { return; }
          if (m.setupComplete && !ok) { ok = true; res(); }
          if (live === L) handle(m);
        }); };
        ws.onclose = (ev) => {
          if (!ok) { connect(i + 1).then(res, rej); return; }
          if (live === L && !L.closed) { o.onError && o.onError({code: "closed", message: (ev.reason || String(ev.code)).slice(0, 80)}); talkLive.stop(); }
        };
      });
      return navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}}).then(stream => {
        L.stream = stream;
        return connect(0).then(() => {
          const src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1), step = ctx.sampleRate / 16000;
          proc.onaudioprocess = (e) => {
            if (live !== L || !L.ready || speaking() || L.ws.readyState !== 1) return;
            const x = e.inputBuffer.getChannelData(0), n = Math.floor(x.length / step), out = new DataView(new ArrayBuffer(n * 2));
            for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, x[Math.floor(i * step)])); out.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
            L.ws.send(JSON.stringify({realtimeInput: {audio: {data: b64(new Uint8Array(out.buffer)), mimeType: "audio/pcm;rate=16000"}}}));
          };
          src.connect(proc); proc.connect(ctx.destination); L.proc = proc;
        });
      }).catch(e => { talkLive.stop(); throw (e && e.code) ? e : {code: e && e.name === "NotAllowedError" ? "not_granted" : "unavailable", message: String(e && e.message || e)}; });
    },
    stop() {
      const L = live; live = null; if (!L) return; L.closed = true;
      try { L.proc && L.proc.disconnect(); } catch {}
      try { L.stream && L.stream.getTracks().forEach(t => t.stop()); } catch {}
      try { L.ws && L.ws.close(); } catch {}
      try { L.ctx.close(); } catch {}
    },
  };
  if (KEY) window.talkLive = talkLive;
  const caps = {sample: KEY ? sample : null, db, user, tts: KEY ? tts : null, dictation: KEY ? dictation : null};
  window.claude = { use: async (n) => caps[n] ?? null };
})();
</script>

<style>

:root {
  --bg: #F3F6F7; --surface: #FFFFFF; --ink: #16222B; --muted: #5A6A76; --line: #D9E1E6;
  --accent: #1E6C74; --accent-ink: #FFFFFF; --accent-soft: #E2EFF0; --stamp: #B9443A; --stamp-soft: #F7E6E3;
  --me: #1E6C74; --me-ink: #FFFFFF;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-ja: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", var(--f-body);
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1519; --surface: #172127; --ink: #E5ECF0; --muted: #8E9FAB; --line: #26343C;
  --accent: #55B4BC; --accent-ink: #0E1519; --accent-soft: #1A3136; --stamp: #E2756A; --stamp-soft: #3A2220;
  --me: #2C7F87; --me-ink: #F2FAFB; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1519; --surface: #172127; --ink: #E5ECF0; --muted: #8E9FAB; --line: #26343C;
  --accent: #55B4BC; --accent-ink: #0E1519; --accent-soft: #1A3136; --stamp: #E2756A; --stamp-soft: #3A2220;
  --me: #2C7F87; --me-ink: #F2FAFB; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.app { height: 100%; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; }
.pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 12px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); background: var(--bg); }

<script>
(() => {
const SCENES = [

  { id: "cafe", ko: "카페 주문", sub: "음료 고르고 계산하기", role: "a barista at a cafe taking the learner's order" },

  { id: "way", ko: "길 묻기", sub: "역·관광지 찾아가기", role: "a local passerby the learner asks for directions to a station or sight" },
  { id: "hotel", ko: "호텔 체크인", sub: "예약 확인·요청하기", role: "a hotel front desk clerk checking the learner in" },
  { id: "shop", ko: "쇼핑", sub: "사이즈·색 묻고 사기", role: "a clothing store clerk helping the learner find a size and color" },
  { id: "airport", ko: "공항·입국", sub: "입국 심사 질문 답하기", role: "an immigration officer asking simple arrival questions" },
  { id: "work", ko: "동료와 점심", sub: "연구소 동료와 가벼운 잡담", role: "a friendly coworker at a research lab chatting over lunch" },
  { id: "free", ko: "자유 대화", sub: "아무 주제나 편하게", role: "a kind friend chatting about anything the learner likes" },
  /* 11/11 주인님 "더 다양한 상황 연출" — 상황 추가 + 매번 작은 돌발 상황 */
  { id: "pharm", ko: "약국·병원", sub: "증상 말하고 약 사기", role: "a pharmacist asking about the learner's symptoms and suggesting medicine" },
  { id: "taxi", ko: "택시", sub: "목적지 말하고 길 바꾸기", role: "a taxi driver taking the learner somewhere in the city" },
  { id: "phone", ko: "전화 예약", sub: "식당·미용실 예약 전화", role: "a staff member answering the phone to take the learner's reservation" },
  { id: "return", ko: "교환·환불", sub: "산 물건에 문제가 있을 때", role: "a store clerk handling the learner's exchange or refund" },
  { id: "meeting", ko: "회의·발표", sub: "내 연구 짧게 소개하기", role: "a foreign research partner in an online meeting asking about the learner's research work" },
  { id: "home", ko: "친구 집 초대", sub: "인사·음식·칭찬하기", role: "a friend who invited the learner to their home for dinner" },
  { id: "trouble", ko: "여행 중 곤란", sub: "지갑 분실·기차 놓침", role: "a station staff member helping the learner who lost something or missed a train" },
  { id: "bar", ko: "술자리", sub: "건배·취미·주말 이야기", role: "a friendly local chatting with the learner at a bar after work" },
  { id: "custom", ko: "✏️ 내가 만들기", sub: "원하는 상황을 직접 적기", role: "" },

const LANG = {
  en: { name: "English", voice: "en-US", tts: "en", ph: "🎤 누르고 영어로 말해 보세요 · 모르면 한국어로 써도 돼요" },
  ja: { name: "Japanese", voice: "ja-JP", tts: "ja", ph: "🎤 누르고 일본어로 말해 보세요 · 모르면 한국어로 써도 돼요" },

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let lang = store.get("malmun-lang") === "ja" ? "ja" : "en";
/* 11/13 대화 단계 — 1 따라 말하기 · 2 골라 말하기 · 3 빈칸 채우기 · 4 자유 대화 */
const LEVELS = [["1", "한글 보고 말하기"], ["2", "골라 말하기"], ["3", "빈칸 채우기"], ["4", "자유 대화"]];
let level = ["1", "2", "3", "4"].includes(store.get("malmun-level")) ? store.get("malmun-level") : "1";
let lesson = null;   // {items:[{t,r,ro,ko}], i, hide, loading, err}
let streak = 0;      // 이 단계에서 고칠 것 없이 말한 횟수 — 3번이면 다음 단계 권유
let scene = null, log = [], busy = false, ctl = null;
let sample = null, db = null, uid = null;
const cards = { en: [], ja: [] }; const loaded = { en: false, ja: false };
let canSave = false, saveChain = Promise.resolve(), booted = false;
let tts = null, ttsOff = false, dict = null, rec = null, listening = false, autoSay = store.get("malmun-auto") !== "0";
const canSpeak = () => !!(tts && !ttsOff) || "speechSynthesis" in window;

function today(off = 0) { const d = new Date(); d.setDate(d.getDate() + off); return d.toISOString().slice(0, 10); }
/* 11/11 주인님 "자연스러운 음성으로 듣고 싶어" — Claude 음성(tts) 먼저, 안 되는 곳(사파리·모바일 앱)은 브라우저 음성 */
function speak(text, slow) {
  if (!text) return;
  if (tts && !ttsOff) {
    tts.speak(text, { language: LANG[lang].tts, rate: slow ? 0.75 : 1, voice: "airy" }).catch((e) => {
      if (e && e.code === "not_granted") { ttsOff = true; }   // 주인님이 끈 것 — 다른 소리로 대신하지 않는다
      // 11/13 주인님 "미니수업·대화에서 말이 안 들려" — AI 음성이 실패하면 조용히 끝내지 말고 폰·브라우저 음성으로 바로 다시 읽는다
      if (e && e.code !== "stopped" && e.code !== "busy" && e.code !== "not_granted") { sayNote("AI 음성 실패(" + e.code + ") — 폰 음성으로 읽어요"); browserSpeak(text, slow); }
    });
    return;
  }

}
function sayNote(t) { const n = $("lesson-note"); if (n) n.textContent = t; const m = $("mic-note"); if (m) m.textContent = t; }
function browserSpeak(text, slow) {
  if (!("speechSynthesis" in window)) { sayNote("⚠️ 이 화면은 소리를 낼 수 없어요"); return; }
  try {
    // 11/11 아이폰 무음: 사파리는 cancel() 바로 뒤 speak() 를 삼키는 버그가 있다 → 말하는 중일 때만 끊는다
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = LANG[lang].voice; u.rate = slow ? 0.7 : 0.92; u.volume = 1;
    const v = bestVoice(LANG[lang].voice); if (v) u.voice = v;
    u.onstart = () => { document.body.classList.add("speaking"); spoke = true; };
    u.onend = () => document.body.classList.remove("speaking");
    u.onerror = (e) => { document.body.classList.remove("speaking"); if (e && e.error && e.error !== "interrupted" && e.error !== "canceled") $("mic-note").textContent = "⚠️ 소리 실패: " + e.error + " — 아래 '🔊 소리 시험'을 눌러 보세요"; };
    speechSynthesis.resume();
    speechSynthesis.speak(u);
  } catch (e) { $("mic-note").textContent = "⚠️ 소리 실패: " + (e && e.message || e); }
}
let spoke = false;
/* 11/11: 브라우저 음성 중 가장 자연스러운 것 — 아이폰은 '향상됨/프리미엄'(Samantha·Ava·Kyoko 등), 크롬은 Google 음성 */
function bestVoice(tag) {
  try {
    const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.replace("_", "-").toLowerCase().startsWith(tag.slice(0, 2)));
    const score = v => (/premium|enhanced|향상|고품질/i.test(v.name) ? 4 : 0) + (/google|siri|neural|natural/i.test(v.name) ? 3 : 0)
      + (/samantha|ava|allison|kyoko|otoya|nicky|zoe/i.test(v.name) ? 2 : 0) + (v.lang.replace("_", "-") === tag ? 1 : 0);
    return vs.sort((a, b) => score(b) - score(a))[0] || null;
  } catch { return null; }
}
try { speechSynthesis.onvoiceschanged = () => {}; speechSynthesis.getVoices(); } catch {}
function stopSpeak() { if (tts) tts.stop().catch(() => {}); try { speechSynthesis.cancel(); } catch {} }
function sayTools(text, saveObj) {
  const t = el("div", "tools");
  if (canSpeak()) {
    const a = el("button", "chip", "▶ 듣기"); a.type = "button"; a.onclick = () => speak(text, false);
    const b = el("button", "chip", "천천히"); b.type = "button"; b.onclick = () => speak(text, true);
    t.append(a, b);
  }
  if (saveObj) {
    const s = el("button", "chip", "카드에 담기"); s.type = "button";
    if (has(saveObj.text)) { s.textContent = "담음"; s.classList.add("on"); s.disabled = true; }
    s.onclick = () => { addCard(saveObj); s.textContent = "담음"; s.classList.add("on"); s.disabled = true; };
    t.append(s);
  }
  return t;
}
function textBlock(t, r, ro, ko) {
  const w = el("div");
  w.append(el("div", "tl", t));
  const rd = [r, ro].filter(Boolean).join(" · ");
  if (rd) w.append(el("div", "rd", rd));
  if (ko) w.append(el("div", "ko", ko));

}

/* ---------- language & tabs ---------- */
function setLang(l) {
  lang = l; store.set("malmun-lang", l);

}
function setTab(t) {

$("lang-en").onclick = () => lang !== "en" && setLang("en");
$("lang-ja").onclick = () => lang !== "ja" && setLang("ja");
$("tab-talk").onclick = () => setTab("talk");
$("tab-review").onclick = () => setTab("review");
$("tab-cards").onclick = () => setTab("cards");

/* ---------- talk ---------- */
function renderTalk() {
  const v = $("view-talk"); v.replaceChildren();
  if (!scene) {
    $("dock").hidden = true;
    v.append(el("span", "ticket", LANG[lang].name + " · 초급"));

    listening = false; micUI(); $("mic").disabled = true; $("mic-note").textContent = "🎧 알아듣는 중…";
    let err = null; try { await dict.stop(); } catch (e) { err = e; }
    $("mic").disabled = false;
    if (err) { micErr("말을 받아 적지 못했어요 (" + (err.code || err.message || "?") + ") — 한 번 더 눌러 말해 주세요"); return; }
    if (!$("say").value.trim()) { micErr("소리가 안 들렸어요 — 폰을 입 가까이 대고 다시 말해 주세요"); return; }
    showMic(); send(); return;
  }
  if (rec) { micStopping = true; rec.stop(); }
}
$("mic").onclick = () => { if (busy) return; listening ? micStop() : micStart(); };

/* ---------- 발음 확인 (11/13 주인님 "내가 말하는게 정확한 발음인지 확인") ----------
   고른 언어로 받아 적은 글자를 목표 문장과 단어(일본어는 글자) 단위로 맞춰 본다. 받아쓰기가 알아들었다 = 원어민 귀에도 그렇게 들릴 가능성이 높다. */
let cap = null;   // {stop, text}
function capStart(onDone) {
  stopSpeak(); let txt = "";
  if (dict) {
    onDictFinal = (e) => { txt = (txt + " " + e.text).trim(); };
    const p = dict.start({ language: LANG[lang].voice });
    cap = { stop: async () => { try { await dict.stop(); } catch {} onDictFinal = null; cap = null; onDone(txt); } };
    p.catch((e) => { cap = null; onDictFinal = null; onDone(null, "받아쓰기 시작 실패: " + (e && e.code || "?")); });
    return true;
  }
  if (!SR) { onDone(null, "이 화면에선 마이크를 못 써요"); return false; }
  const r = new SR(); r.lang = LANG[lang].voice; r.interimResults = false;
  r.continuous = !/iPhone|iPad|iPod/.test(navigator.userAgent);   // 아이폰 사파리는 continuous 에서 끊김 — 한 마디 듣고 끝나면 바로 점수
  r.onresult = (e) => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) txt += " " + e.results[i][0].transcript; };
  let ended = false;
  r.onend = () => { if (ended) return; ended = true; cap = null; onDone(txt.trim()); };
  r.onerror = (e) => { if (e && e.error !== "aborted" && e.error !== "no-speech") { ended = true; cap = null; onDone(null, "마이크 오류: " + e.error); } };
  try { r.start(); } catch (e) { onDone(null, "마이크를 켤 수 없어요"); return false; }
  cap = { stop: async () => { try { r.stop(); } catch {} } };
  return true;
}
function norm(s) { return (s || "").toLowerCase().replace(/[.,!?¿¡'"’“”、。！？「」・…\-]/g, " ").replace(/\s+/g, " ").trim(); }
function pronCheck(target, said) {
  const ja = lang === "ja";
  const a = ja ? [...norm(target).replace(/\s/g, "")] : norm(target).split(" ");
  const b = ja ? [...norm(said).replace(/\s/g, "")] : norm(said).split(" ");
  const left = b.slice(); const miss = [];
  for (const w of a) { const k = left.indexOf(w); if (k >= 0) left.splice(k, 1); else miss.push(w); }
  const score = a.length ? Math.round((a.length - miss.length) / a.length * 100) : 0;
  return { score, miss };
}
function pronBox(target, onRetry) {
  const box = el("div", "pron");
  const btn = el("button", "chip on", "🎤 따라 말하고 발음 확인"); btn.type = "button";
  const out = el("div", "note");
  btn.onclick = () => {
    if (cap) { btn.textContent = "알아듣는 중…"; cap.stop(); return; }
    out.textContent = "";
    const ok = capStart((said, err) => {
      btn.textContent = "🎤 다시 말해 보기";
      if (err) { out.textContent = "⚠️ " + err; return; }
      if (!said) { out.textContent = "소리가 안 들렸어요 — 폰을 입 가까이 대고 다시 말해 주세요"; return; }
      const r = pronCheck(target, said);
      out.replaceChildren();
      out.append(el("div", r.score >= 90 ? "ok" : r.score >= 60 ? "mid" : "bad", `발음 ${r.score}점 — ${r.score >= 90 ? "정확해요! 👏" : r.score >= 60 ? "거의 맞아요" : "다시 해 봐요"}`));
      out.append(el("div", "rd", "들린 말: " + said));
      if (r.miss.length) out.append(el("div", "rd", "안 들린 부분: " + r.miss.join(lang === "ja" ? "" : ", ") + " — '천천히'로 듣고 그 부분만 또박또박"));
    });
    if (ok) btn.textContent = "■ 다 말했으면 누르기";
  };
  box.append(btn, out);
  return box;
}
$("auto").onclick = () => {
  autoSay = !autoSay; store.set("malmun-auto", autoSay ? "1" : "0");
  $("auto").classList.toggle("on", autoSay); $("auto").setAttribute("aria-pressed", String(autoSay));
  if (!autoSay) stopSpeak();
};
$("auto").classList.toggle("on", autoSay); $("auto").setAttribute("aria-pressed", String(autoSay));
$("stopsay").onclick = stopSpeak;
$("testsay").onclick = () => {   // 누른 순간 바로 말한다 — 이것도 안 들리면 폰 무음 스위치·음량·블루투스 문제
  const n = ("speechSynthesis" in window) ? speechSynthesis.getVoices().length : -1;
  speak(lang === "ja" ? "こんにちは。聞こえますか?" : "Hello! Can you hear me?");
  $("mic-note").textContent = `🔊 시험 중 — 안 들리면 무음 스위치(옆 버튼)·음량을 확인해 주세요 [폰 음성 ${n}개 · ${tts ? "AI 음성(만드는 데 2~4초)" : "폰 음성"}]`;
};
showMic();

/* ---------- 실시간 대화 (11/11 주인님 "진짜 대화하는 것 같이") — window.talkLive 가 있는 곳(제미나이 키 판)에서만 ---------- */
let liveOn = false, liveMe = null, liveAi = null;
function liveSystem() {
  const L = LANG[lang].name, ja = lang === "ja";
  return [`You are a patient ${L} conversation partner for a Korean adult who is a complete beginner (CEFR A1). This is a live spoken conversation.`,
    `Role-play: you are ${scene.role}. Stay in the role. Give yourself a name and a small personality; invent concrete details.`,
    `Speak only ${L}, slowly and clearly, 1-2 short sentences per turn with very common words${ja ? ", polite です/ます form" : ""}, and end with something easy to answer.`,
    `React naturally to what the learner said first ("Oh, nice!", "Really?"), then move the scene forward. Don't repeat questions. About every 3-4 turns add a small realistic twist.`,
    `If the learner speaks Korean or makes a mistake, don't lecture — say the natural ${L} sentence they meant in a friendly way ("You mean: ...?") and keep going.`].join("\n");
}
async function liveNote(m, user) {   // 대답 소리를 막지 않게 — 뜻·교정·힌트는 뒤에 따로 채운다
  if (!sample || !m) return;
  const L = LANG[lang].name, ja = lang === "ja";
  try {
    const o = await sample.json([`A Korean beginner is practicing ${L}. Partner said: "${m.reply}". ${user ? `Before that the learner said: "${user.text}".` : ""}`,
      `JSON only: {"ko": Korean translation of partner line, "reading": ${ja ? "partner line in hiragana" : "\"\""}, "romaji": ${ja ? "romaji" : "\"\""},`,
      `"fix": ${user ? `null if the learner's line was natural ${L}, else {"better": natural beginner ${L} sentence they meant, "better_reading": ${ja ? "kana" : "\"\""}, "better_romaji": ${ja ? "romaji" : "\"\""}, "better_ko": Korean, "why": one short Korean sentence}` : "null"},`,
      `"hints": [2 items {"t": short beginner ${L} sentence the learner could say next, "r": ${ja ? "kana" : "\"\""}, "ro": ${ja ? "romaji" : "\"\""}, "ko": Korean}]}`].join("\n"), { modelTier: "quick", cache: false });
    m.ko = o?.ko || ""; m.reading = o?.reading || ""; m.romaji = o?.romaji || ""; m.hints = Array.isArray(o?.hints) ? o.hints.slice(0, 3) : [];
    if (user) { if (o?.fix?.better) user.fix = o.fix; else user.ok = true; }
    renderTalk();
  } catch {}
}
function liveUI(state) {
  $("live").textContent = liveOn ? (state === "speaking" ? "🔊 상대가 말하는 중… (누르면 끝내기)" : state === "connecting" ? "⏳ 연결 중…" : "🎙️ 듣고 있어요 — 말하세요 (누르면 끝내기)") : "🎙️ 실시간 대화 시작 (말하면 바로 대답)";
  $("live").classList.toggle("rec", liveOn);
}
function liveStop() { liveOn = false; try { window.talkLive.stop(); } catch {} liveMe = liveAi = null; liveUI(); }
$("live").onclick = () => {
  if (liveOn) return liveStop();
  if (!window.talkLive || !scene) return;
  stopSpeak(); if (ctl) ctl.abort(); busy = false;
  liveOn = true; liveUI("connecting");
  const past = transcript();
  window.talkLive.start({
    system: liveSystem(), voice: lang === "ja" ? "Aoede" : "Kore",
    opening: past ? `(Conversation so far:\n${past}\nContinue naturally from here with your next short line.)` : "(Start the conversation with your opening line.)",
    onState: (s) => { if (liveOn) liveUI(s); },
    onUser: (t) => { if (!liveMe) { liveMe = { who: "me", text: "" }; const k = liveAi ? log.indexOf(liveAi) : -1; if (k >= 0) log.splice(k, 0, liveMe); else log.push(liveMe); } liveMe.text = t; renderTalk(); },
    onAi: (t) => { if (!liveAi) { liveAi = { who: "ai", reply: "", reading: "", romaji: "", ko: "", hints: [] }; log.push(liveAi); } liveAi.reply = t; renderTalk(); },
    onTurn: () => { const m = liveAi, u = liveMe; liveMe = liveAi = null; liveNote(m, u); },
    onError: (e) => { liveStop(); micErr("실시간 연결이 끊겼어요 (" + (e.code || "") + " " + (e.message || "") + ") — 다시 눌러 주세요"); },
  }).catch((e) => { liveStop(); micErr("실시간 대화를 못 열었어요 (" + ((e && (e.code || e.message)) || "?") + ")" + (e && e.code === "not_granted" ? " — 마이크 허용이 필요해요" : "")); });
};
$("end").onclick = () => { if (liveOn) liveStop(); if (ctl) ctl.abort(); scene = null; log = []; lesson = null; busy = false; $("send").disabled = false; renderTalk(); };

/* ---------- cards (db: data/users/<uid>/cards-<lang>) ---------- */
function has(text) { return cards[lang].some(c => c.text === text); }
function cardDoc(l) { return db.doc("data/users/" + uid + "/cards-" + l); }
async function loadCards() {
  if (!canSave || loaded[lang]) return;
  const l = lang;
  try { const s = await cardDoc(l).get(); cards[l] = s.exists && Array.isArray(s.data().items) ? s.data().items.slice() : []; loaded[l] = true; }
  catch { /* keep in-memory */ }
}
function persist(l) {
  if (!canSave) return;
  const items = cards[l].slice();
  saveChain = saveChain.then(() => cardDoc(l).set({ items, updated: new Date().toISOString() })).catch((e) => {
    if (e && e.code === "invalid_argument") canSave = false;
    showSaveNote();
  });
}
function addCard(o) {
  if (!o.text || has(o.text)) return;
  cards[lang].push({ id: Math.random().toString(36).slice(2, 10), text: o.text, reading: o.reading, romaji: o.romaji, ko: o.ko, box: 0, due: today(), added: today() });
  persist(lang); updateBadge();
}
function dueList() { const d = today(); return cards[lang].filter(c => c.due <= d); }
function updateBadge() { const n = dueList().length; $("due-badge").hidden = n === 0; $("due-badge").textContent = n; }
function showSaveNote() {
  for (const id of ["view-review", "view-cards"]) {
    const v = $(id); if (!v.querySelector(".savenote") && !canSave) { const n = el("p", "note savenote", "이 화면에서는 카드가 저장되지 않아요. 창을 닫으면 사라져요."); v.prepend(n); }
  }
}
const GAPS = [1, 2, 4, 7, 15, 30, 60];
let reveal = false;
function renderReview() {
  const v = $("view-review"); v.replaceChildren(); updateBadge();
  const due = dueList();
  v.append(el("div", "stat", `오늘 복습 ${due.length}장 · 전체 ${cards[lang].length}장`));
  if (!cards[lang].length) { v.append(el("p", "lede", "아직 담은 표현이 없어요. 대화하다가 '카드에 담기'를 누르면 여기서 다시 연습할 수 있어요.")); showSaveNote(); return; }
  if (!due.length) { v.append(el("p", "lede", "오늘 복습은 끝났어요. 내일 다시 만나요.")); showSaveNote(); return; }
  const c = due[0];
  const card = el("div", "card");
  card.append(el("div", "mini", "이 말을 " + (lang === "ja" ? "일본어" : "영어") + "로 소리 내어 말해 보세요"));
  card.append(el("div", "q", c.ko || "(뜻 없음)"));
  if (!reveal) {
    const r = el("button", "btn", "정답 보기"); r.type = "button"; r.onclick = () => { reveal = true; renderReview(); speak(c.text); }; card.append(r);
  } else {
    const t = textBlock(c.text, c.reading, c.romaji, ""); t.querySelector(".tl").className = "card-tl"; card.append(t);
    card.append(sayTools(c.text, null));
    const row = el("div", "row");
    const ok = el("button", "btn", "말할 수 있었어요"); ok.type = "button";
    ok.onclick = () => { c.box = Math.min(c.box + 1, GAPS.length - 1); c.due = today(GAPS[c.box - 1] || 1); reveal = false; persist(lang); renderReview(); };
    const no = el("button", "btn ghost", "다시 볼래요"); no.type = "button";
    no.onclick = () => { c.box = 0; c.due = today(1); reveal = false; persist(lang); renderReview(); };
    row.append(ok, no); card.append(row);
    card.append(el("div", "stat", `${c.box}단계 · 맞히면 ${GAPS[Math.min(c.box, GAPS.length - 1)]}일 뒤 다시`));
  }
  v.append(card); showSaveNote();
}
let armed = null;
function renderCards() {
  const v = $("view-cards"); v.replaceChildren();
  v.append(el("div", "stat", `${LANG[lang].name} 표현 ${cards[lang].length}장`));
  if (!cards[lang].length) { v.append(el("p", "lede", "대화 중 '카드에 담기'를 누른 표현이 여기 모여요.")); showSaveNote(); return; }
  const list = el("div", "list");
  for (const c of cards[lang].slice().reverse()) {
    const li = el("div", "li"); const body = textBlock(c.text, c.reading, c.romaji, c.ko);
    const side = el("div", "tools"); side.style.flex = "0 0 auto"; side.style.flexDirection = "column";
    if (canSpeak()) { const p = el("button", "chip", "▶"); p.type = "button"; p.setAttribute("aria-label", "듣기"); p.onclick = () => speak(c.text); side.append(p); }
    const d = el("button", "chip", armed === c.id ? "정말 빼기" : "빼기"); d.type = "button";
    d.onclick = () => { if (armed !== c.id) { armed = c.id; renderCards(); return; } cards[lang] = cards[lang].filter(x => x.id !== c.id); armed = null; persist(lang); updateBadge(); renderCards(); };
    side.append(d); li.append(body, side); list.append(li);
  }
  v.append(list); showSaveNote();
}

/* ---------- boot ---------- */
document.body.classList.toggle("ja", lang === "ja");
$("lang-en").setAttribute("aria-pressed", String(lang === "en"));
$("lang-ja").setAttribute("aria-pressed", String(lang === "ja"));
$("say").placeholder = LANG[lang].ph;
renderTalk(); renderReview(); renderCards();
(async () => {
  if (!window.claude || !window.claude.use) { booted = true; renderTalk(); return; }
  const [s, d, u, sp, dc] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("user"), claude.use("tts"), claude.use("dictation")]);
  sample = s; db = d; booted = true; tts = sp; dict = dc;
  if (dict) {
    dict.onPartial(({ text }) => { if (listening) micText(text); });
    dict.onFinal((e) => { if (onDictFinal) onDictFinal(e); });
    dict.onState(({ state }) => { if (state === "idle" && listening) { listening = false; micUI(); } });
  }
  if (tts) tts.onState(({ state }) => { document.body.classList.toggle("speaking", state !== "idle"); });
  showMic();
  $("live").hidden = !window.talkLive;
  if (u) { try { uid = await u.id(); } catch {} }
  canSave = !!(db && uid);
  if (canSave) { await loadCards(); }
  if (!scene) renderTalk();
  renderReview(); renderCards(); updateBadge();
})();
})();
</script>
